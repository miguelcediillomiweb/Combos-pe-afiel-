<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combos Peñafiel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#202124}
header{text-align:center;background:#fff;padding:25px 15px;border-bottom:1px solid #ddd;box-shadow:0 3px 15px #0001}
h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:900}header p{margin:7px 0 0;color:#666}
main{width:min(1200px,calc(100% - 24px));margin:24px auto 45px}
.controls{text-align:center;margin-bottom:22px}.btn{border:0;border-radius:30px;background:#111;color:#fff;padding:12px 22px;font-weight:800;cursor:pointer}
.state{text-align:center;background:#fff;padding:35px 18px;border-radius:18px;box-shadow:0 6px 20px #0001}.state h2{margin:0 0 8px}.state p{margin:0;color:#666}.hidden{display:none!important}
#combos{display:flex;flex-direction:column;align-items:center;gap:14px}
.combo{width:20cm;height:5cm;max-width:100%;background:#fff;border-radius:10px;overflow:hidden;border:2px solid #222;box-shadow:0 6px 18px #0002;display:flex;flex-direction:column;position:relative}
.bar{height:12px;flex:none;background:#000}
.content{padding:5px 24px;display:flex;align-items:center;gap:8px;position:relative;flex:1;min-width:0}
.brands{width:15%;min-width:75px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.brand{max-width:78px;max-height:58px;object-fit:contain}.brandText{font-weight:900;font-size:12px;text-transform:uppercase;text-align:center;line-height:1.05}
.title{position:absolute;opacity:0;pointer-events:none}
.products{width:41%;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}.product{width:82px;text-align:center;flex:none}.product img{width:78px;height:78px;object-fit:contain}.productText{width:58px;height:48px;margin:auto;padding:4px;border-radius:7px;background:#f0f2f4;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;overflow:hidden}
.gift{width:21%;margin:0;padding:5px 7px;border:2px dashed #d5b300;border-radius:8px;background:#fffbea;text-align:center;min-width:90px}.giftLabel{font-size:8px;font-weight:800;color:#806d00;text-transform:uppercase;line-height:1.05}.giftText{font-size:13px;font-weight:900;margin-top:2px;line-height:1.05}.gift img{width:45px;height:45px;object-fit:contain;margin-top:2px}
.priceBox{width:23%;text-align:center;border-left:1px solid #eee;margin:0;padding:0 0 0 8px}.priceLabel{font-size:8px;font-weight:800;color:#666;line-height:1.05}.price{font-size:43px;font-weight:900;line-height:1;margin-top:2px;white-space:nowrap}.price small{font-size:17px;vertical-align:top}.cardFoot{display:none}
footer{text-align:center;color:#666;font-size:12px;padding:25px}
@media(max-width:600px){main{width:100%;margin-top:15px}#combos{gap:12px}.combo{width:100%;height:auto;min-height:145px;aspect-ratio:4/1}.content{padding:6px;gap:4px}.brands{min-width:55px}.brand{max-width:48px;max-height:32px}.products{width:38%}.product{width:48px}.product img{width:43px;height:43px}.productText{width:43px;height:36px;font-size:7px}.gift{min-width:62px;padding:4px}.priceBox{padding-left:3px}.price{font-size:24px}.price small{font-size:12px}.endCap{width:12px}.endCap span{font-size:5px}}
@media print{body{background:#fff}header,.controls,footer{display:none!important}main{width:100%;margin:0}.combo{width:20cm;height:5cm;max-width:none;break-inside:avoid;box-shadow:none;border:1px solid #222;border-radius:0;margin:0 0 3mm 0}.content{padding:7px 10px}#combos{gap:3mm;align-items:flex-start}}.endCaps{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:space-between;pointer-events:none}
.endCap{width:24px;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.endCap span{color:#fff;font-size:7px;font-weight:900;letter-spacing:.4px;line-height:1.15;writing-mode:vertical-rl;transform:rotate(180deg);white-space:normal;text-align:center}

footer{text-align:center;color:#666;font-size:12px;padding:25px}
@media(max-width:600px){main{width:100%;margin-top:15px}#combos{gap:12px}.combo{width:100%;height:auto;min-height:145px;aspect-ratio:4/1}.content{padding:6px;gap:4px}.brands{min-width:55px}.brand{max-width:48px;max-height:32px}.products{width:38%}.product{width:48px}.product img{width:43px;height:43px}.productText{width:43px;height:36px;font-size:7px}.gift{min-width:62px;padding:4px}.priceBox{padding-left:3px}.price{font-size:24px}.price small{font-size:12px}.endCap{width:12px}.endCap span{font-size:5px}}
@media print{body{background:#fff}header,.controls,footer{display:none!important}main{width:100%;margin:0}.combo{width:20cm;height:5cm;max-width:none;break-inside:avoid;box-shadow:none;border:1px solid #222;border-radius:0;margin:0 0 3mm 0}.content{padding:7px 10px}#combos{gap:3mm;align-items:flex-start}}
</style>
</head>
<body>
<header><h1>COMBOS PEÑAFIEL</h1><p>Precios sugeridos · Catálogo digital</p></header>
<main>
<div class="controls"><button class="btn" onclick="cargarCombos()">🔄 Actualizar combos</button> <button class="btn" onclick="window.print()">🖨️ Imprimir / guardar PDF</button></div>
<div id="loading" class="state"><h2>⏳ Cargando combos...</h2><p>Consultando Google Sheets...</p></div>
<div id="error" class="state hidden"><h2>⚠️ No se pudo cargar la información</h2><p id="errorText"></p></div>
<div id="empty" class="state hidden"><h2>📋 No hay combos activos</h2><p>Revisa la columna ACTIVO en Google Sheets.</p></div>
<section id="combos"></section>
</main>
<footer><strong>Combos Peñafiel</strong><br>Información actualizada desde Google Sheets</footer>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRx-Tod-3a_Nz9yBMX0l71qMOoXmzfvctX2wkA_mfMYas56r-PsyCXVx3yfKzYrfxabDrXcdUnYTheo/pub?output=csv";
const PROXY="https://api.allorigins.win/raw?url=";
const $=id=>document.getElementById(id);
function norm(v){return String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function csv(text){
 let rows=[],row=[],cell="",q=false;
 for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];
  if(c=='"'&&q&&n=='"'){cell+='"';i++}
  else if(c=='"')q=!q;
  else if(c==","&&!q){row.push(cell);cell=""}
  else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&n=="\n")i++;row.push(cell);cell="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
  else cell+=c;
 }
 if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}
 if(!rows.length)return[];
 let heads=rows[0].map(norm);
 return rows.slice(1).map(r=>Object.fromEntries(heads.map((h,i)=>[h,(r[i]??"").trim()])));
}
function get(r,names){for(const n of names){let k=norm(n);if(k in r)return r[k]}return""}
function active(v){return ["si","s","true","1","activo","x","yes"].includes(norm(v))}
function isUrl(v){return /^https?:\/\//i.test(String(v||"").trim())}
function split(v){return String(v||"").split(/\s*(?:\||;|\n)\s*/).map(x=>x.trim()).filter(Boolean)}
function brand(v){if(!v)return"";return isUrl(v)?'<img class="brand" src="'+esc(v)+'" alt="Marca">':'<div class="brandText">'+esc(v)+'</div>'}
function products(v1,v2){
 return [...split(v1),...split(v2)].map(v=>isUrl(v)?'<div class="product"><img src="'+esc(v)+'" alt="Producto"></div>':'<div class="product"><div class="productText">'+esc(v)+'</div></div>').join("")
}
function price(v){
 let s=String(v||"").replace(/[^0-9,.-]/g,""),n;
 if(s.includes(",")&&s.includes("."))n=parseFloat(s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,""));
 else if(s.includes(",")){let a=s.split(",");n=parseFloat(a.length==2&&a[1].length<=2?a[0]+"."+a[1]:s.replace(/,/g,""))}
 else n=parseFloat(s);
 return Number.isFinite(n)?n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v);
}
function card(r,i){
 let m1=get(r,["marca_1","marca 1","marca1"]),m2=get(r,["marca_2","marca 2","marca2"]);
 let p1=get(r,["productos_1","productos 1","productos1"]),p2=get(r,["productos_2","productos 2","productos2"]);
 let tl=get(r,["texto_regalo","texto regalo","textoregalo"]),g=get(r,["regalo"]);
 let pc=get(r,["precio_combo","precio combo","preciocombo","precio"]);
 let gift="";
 if(tl||g)gift='<div class="gift"><div class="giftLabel">'+esc(tl||"REGALO")+'</div>'+(g?(isUrl(g)?'<img src="'+esc(g)+'" alt="Regalo">':'<div class="giftText">'+esc(g)+'</div>'):"")+'</div>';
 return '<article class="combo"><div class="bar"></div><div class="content"><div class="brands">'+brand(m1)+brand(m2)+'</div><div class="products">'+products(p1,p2)+'</div>'+gift+'<div class="priceBox"><div class="priceLabel">PRECIO COMBO</div><div class="price"><small>$</small>'+price(pc)+'</div></div><div class="endCaps"><div class="endCap"><span>ADQUIERE TU PROMOCIÓN · ADQUIERE TU PROMOCIÓN · ADQUIERE TU PROMOCIÓN</span></div><div class="endCap"><span>ADQUIERE TU PROMOCIÓN · ADQUIERE TU PROMOCIÓN · ADQUIERE TU PROMOCIÓN</span></div></div></div></article>';
}
async function cargarCombos(){
 $("loading").classList.remove("hidden");$("error").classList.add("hidden");$("empty").classList.add("hidden");$("combos").innerHTML="";
 try{
  const u=CSV_URL+"&t="+Date.now();
  let res;
  try{res=await fetch(u,{cache:"no-store"})}catch(e){}
  if(!res||!res.ok){res=await fetch(PROXY+encodeURIComponent(u),{cache:"no-store"})}
  if(!res.ok)throw new Error("No se pudo leer Google Sheets (HTTP "+res.status+").");
  const text=await res.text();
  if(!text.trim()||text.trim().startsWith("<"))throw new Error("Google Sheets no devolvió un CSV válido.");
  const rows=csv(text);
  if(!rows.length)throw new Error("El CSV no contiene filas de datos.");
  const activeRows=rows.filter(r=>active(get(r,["activo","activa","active"])));
  $("loading").classList.add("hidden");
  if(!activeRows.length){$("empty").classList.remove("hidden");return}
  activeRows.forEach((r,i)=>$("combos").insertAdjacentHTML("beforeend",card(r,i+1)));
 }catch(e){console.error(e);$("loading").classList.add("hidden");$("error").classList.remove("hidden");$("errorText").textContent=e.message||"Error desconocido."}
}
document.addEventListener("DOMContentLoaded",cargarCombos);
</script>
</body>
</html>
